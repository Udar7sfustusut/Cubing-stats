<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cubing Chart Generator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      width: 100%;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .window-frame {
      background-color: #121212;
      border-radius: 10px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .window-header {
      background: linear-gradient(180deg, #2c2c2e 0%, #1c1c1e 100%);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #000;
    }

    .window-buttons {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-close { background-color: #ff5f56; border: 1px solid #e0443e; }
    .dot-min { background-color: #ffbd2e; border: 1px solid #dea123; }
    .dot-max { background-color: #27c93f; border: 1px solid #1aab29; }

    .window-title {
      flex-grow: 1;
      text-align: center;
      font-size: 0.85rem;
      color: #a1a1a6;
      font-weight: 500;
      margin-right: 52px;
    }

    .app-body {
      display: grid;
      grid-template-columns: 1fr 300px;
      background-color: #1a1a1a;
    }

    @media (max-width: 850px) {
      .app-body {
        grid-template-columns: 1fr;
      }
    }

    .chart-container {
      position: relative;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #111;
      min-height: 420px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      max-height: 400px;
    }

    .controls-sidebar {
      background-color: #262626;
      padding: 1rem;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      font-size: 0.85rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      color: #ccc;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"], input[type="number"], select {
      background-color: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      outline: none;
      font-size: 0.85rem;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      border-color: var(--accent);
    }

    .zoom-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .zoom-btn {
      flex: 1;
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      transition: background 0.2s;
    }

    .zoom-btn:hover {
      background-color: #444;
    }

    .range-inputs {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .range-inputs input {
      width: 50%;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #eee;
      cursor: pointer;
      text-transform: none;
      font-weight: normal;
    }

    .btn {
      background-color: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background-color 0.2s;
      text-align: center;
    }

    .btn:hover {
      background-color: #0369a1;
    }

    .btn-secondary {
      background-color: #475569;
    }
    .btn-secondary:hover {
      background-color: #334155;
    }

    .color-picker-wrapper {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    input[type="color"] {
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: #1e293b;
      padding: 1.5rem;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    textarea {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      height: 180px;
      resize: vertical;
      font-family: monospace;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Cubing Chart Generator</h1>
      <p>Generate clean solve-time distribution charts from csTimer session exports</p>
    </header>

    <div class="window-frame">
      <div class="window-header">
        <div class="window-buttons">
          <div class="dot dot-close"></div>
          <div class="dot dot-min"></div>
          <div class="dot dot-max"></div>
        </div>
        <div class="window-title">Fancy Times Distribution Charts</div>
      </div>

      <div class="app-body">
        <div class="chart-container">
          <canvas id="distributionChart"></canvas>
        </div>

        <div class="controls-sidebar">
          <div class="control-group">
            <label>Title</label>
            <input type="text" id="chartTitle" value="SOLVE DISTRIBUTION" />
          </div>

          <div class="control-group">
            <label>Smoothing (Detail)</label>
            <input type="range" id="bandwidth" min="0.2" max="2.0" step="0.1" value="0.7" />
          </div>

          <!-- Zoom Controls -->
          <div class="control-group">
            <label>Zoom & X-Axis Range (s)</label>
            <div class="zoom-controls">
              <button class="zoom-btn" id="zoomInBtn" title="Zoom In">+</button>
              <button class="zoom-btn" id="zoomOutBtn" title="Zoom Out">-</button>
              <button class="zoom-btn" id="zoomResetBtn" style="font-size: 0.75rem;">Reset</button>
            </div>
            <div class="range-inputs" style="margin-top: 4px;">
              <input type="number" id="minX" placeholder="Min" step="0.5" />
              <input type="number" id="maxX" placeholder="Max" step="0.5" />
            </div>
          </div>

          <div class="control-group">
            <label class="checkbox-label">
              <input type="checkbox" id="showStats" checked /> Show Stats Overlay
            </label>
          </div>

          <div class="control-group">
            <button class="btn" id="pasteDataBtn">Paste Data (Set 1)</button>
            <div class="color-picker-wrapper">
              <input type="color" id="color1" value="#f97316" />
              <span style="color:#aaa; font-size:0.8rem;">Dataset 1 Color</span>
            </div>
          </div>

          <div class="control-group">
            <label class="checkbox-label">
              <input type="checkbox" id="showQuartiles" checked /> Show Quartiles (25%, 50%, 75%)
            </label>
          </div>

          <hr style="border-color: #444; margin: 4px 0;" />

          <div class="control-group">
            <button class="btn btn-secondary" id="pasteData2Btn">Paste 2nd Data</button>
            <div class="color-picker-wrapper">
              <input type="color" id="color2" value="#a855f7" />
              <span style="color:#aaa; font-size:0.8rem;">Dataset 2 Color</span>
            </div>
          </div>

          <div class="control-group" style="margin-top: auto; gap: 0.5rem;">
            <button class="btn btn-secondary" id="saveImgBtn">Save Image</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Paste Modal -->
  <div class="modal" id="pasteModal">
    <div class="modal-content">
      <h3 style="color:#fff;" id="modalTitle">Paste Solves Data</h3>
      <p style="color:#aaa; font-size: 0.8rem;">Supports csTimer export format, raw numbers, or lists.</p>
      <textarea id="dataInput" placeholder="Paste csTimer session text or times here..."></textarea>
      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button class="btn btn-secondary" id="closeModalBtn">Cancel</button>
        <button class="btn" id="loadDataBtn">Load Data</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // State Variables
    let dataset1 = [];
    let dataset2 = [];
    let targetDataset = 1;
    let customMinX = null;
    let customMaxX = null;

    // Default Demo Data
    dataset1 = [12.07, 13.2, 13.8, 14.1, 14.41, 14.5, 14.8, 15.1, 15.9, 16.2, 17.19];
    // Fill realistic normal distribution
    for(let i=0; i<80; i++) {
      let u = 0, v = 0;
      while(u === 0) u = Math.random();
      while(v === 0) v = Math.random();
      let num = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
      dataset1.push(14.4 + num * 1.1);
      dataset2.push(16.2 + num * 1.5);
    }

    // Elements
    const canvas = document.getElementById('distributionChart');
    const ctx = canvas.getContext('2d');
    const chartTitleInput = document.getElementById('chartTitle');
    const bandwidthInput = document.getElementById('bandwidth');
    const showStatsInput = document.getElementById('showStats');
    const showQuartilesInput = document.getElementById('showQuartiles');
    const color1Input = document.getElementById('color1');
    const color2Input = document.getElementById('color2');
    const minXInput = document.getElementById('minX');
    const maxXInput = document.getElementById('maxX');

    let chartInstance = null;

    // Parser for csTimer exports and generic times
    function parseTimes(text) {
      const times = [];
      const lines = text.split('\n');

      for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        // csTimer line pattern matching "1. 28.83   U R2..." or "138. 26.75+   U..."
        const csTimerMatch = line.match(/^\d+\.\0*([0-9]+(?:\.[0-9]+)?)\+?\s*\[?/);
        if (csTimerMatch) {
          const val = parseFloat(csTimerMatch[1]);
          if (!isNaN(val)) times.push(val);
          continue;
        }

        // Standard number extraction
        const genericMatch = line.match(/^([0-9]+(?:\.[0-9]+)?)$/);
        if (genericMatch) {
          const val = parseFloat(genericMatch[1]);
          if (!isNaN(val)) times.push(val);
        }
      }

      if (times.length === 0) {
        // Fallback: match any floating point numbers in the whole text
        const matches = text.match(/\b\d+\.\d+\b/g);
        if (matches) {
          matches.forEach(m => {
            const val = parseFloat(m);
            if (!isNaN(val) && val < 300) times.push(val);
          });
        }
      }

      return times;
    }

    // Math Utility Functions
    function getStats(data) {
      if (!data || data.length === 0) return null;
      const sorted = [...data].sort((a,b) => a - b);
      const min = sorted[0];
      const max = sorted[sorted.length - 1];
      const sum = sorted.reduce((a, b) => a + b, 0);
      const avg = sum / sorted.length;
      
      const median = sorted.length % 2 === 0 
        ? (sorted[sorted.length/2 - 1] + sorted[sorted.length/2]) / 2 
        : sorted[Math.floor(sorted.length/2)];

      const q25 = sorted[Math.floor(sorted.length * 0.25)];
      const q75 = sorted[Math.floor(sorted.length * 0.75)];

      return { best: min, worst: max, avg, median, q25, q75, count: sorted.length };
    }

    // Kernel Density Estimation (Gaussian)
    function kde(data, bandwidth, points) {
      return points.map(x => {
        let sum = 0;
        for (let i = 0; i < data.length; i++) {
          let arg = (x - data[i]) / bandwidth;
          sum += Math.exp(-0.5 * arg * arg);
        }
        return sum / (data.length * bandwidth * Math.sqrt(2 * Math.PI));
      });
    }

    function renderChart() {
      if (chartInstance) chartInstance.destroy();

      const allData = [...dataset1, ...dataset2];
      if (allData.length === 0) return;

      const globalMin = Math.min(...allData);
      const globalMax = Math.max(...allData);

      // Determine X-axis bounds
      const xMin = customMinX !== null ? customMinX : Math.floor(globalMin - 1);
      const xMax = customMaxX !== null ? customMaxX : Math.ceil(globalMax + 1);

      // Update input placeholder/values
      if (customMinX === null) minXInput.value = '';
      if (customMaxX === null) maxXInput.value = '';

      // Generate X evaluation points
      const numPoints = 120;
      const step = (xMax - xMin) / numPoints;
      const xPoints = Array.from({length: numPoints + 1}, (_, i) => xMin + i * step);

      const bw = parseFloat(bandwidthInput.value);

      // Datasets KDE
      const kde1 = dataset1.length > 0 ? kde(dataset1, bw, xPoints) : [];
      const kde2 = dataset2.length > 0 ? kde(dataset2, bw, xPoints) : [];

      const datasets = [];

      // Dataset 1
      if (dataset1.length > 0) {
        datasets.push({
          label: 'Set 1',
          data: kde1,
          borderColor: color1Input.value,
          backgroundColor: color1Input.value + '44',
          fill: true,
          tension: 0.4,
          pointRadius: 0
        });
      }

      // Dataset 2
      if (dataset2.length > 0) {
        datasets.push({
          label: 'Set 2',
          data: kde2,
          borderColor: color2Input.value,
          backgroundColor: color2Input.value + '44',
          fill: true,
          tension: 0.4,
          pointRadius: 0
        });
      }

      // Plugins for Custom Overlay & Quartile Lines
      const customOverlayPlugin = {
        id: 'customOverlay',
        afterDraw(chart) {
          const { ctx, chartArea: { left, right, top, bottom }, scales: { x, y } } = chart;

          // Render Statistics Box
          if (showStatsInput.checked) {
            ctx.save();
            ctx.font = '11px monospace';
            ctx.fillStyle = '#ffffff';

            let offsetY = top + 20;

            if (dataset1.length > 0) {
              const s1 = getStats(dataset1);
              ctx.fillText(`Best: ${s1.best.toFixed(2)}`, right - 110, offsetY);
              ctx.fillText(`Worst: ${s1.worst.toFixed(2)}`, right - 110, offsetY + 14);
              ctx.fillText(`Average: ${s1.avg.toFixed(2)}`, right - 110, offsetY + 28);
              ctx.fillText(`Median: ${s1.median.toFixed(2)}`, right - 110, offsetY + 42);
              offsetY += 70;
            }

            if (dataset2.length > 0) {
              const s2 = getStats(dataset2);
              ctx.fillText(`Best: ${s2.best.toFixed(2)}`, right - 110, offsetY);
              ctx.fillText(`Worst: ${s2.worst.toFixed(2)}`, right - 110, offsetY + 14);
              ctx.fillText(`Average: ${s2.avg.toFixed(2)}`, right - 110, offsetY + 28);
              ctx.fillText(`Median: ${s2.median.toFixed(2)}`, right - 110, offsetY + 42);
            }
            ctx.restore();
          }

          // Render Quartile Vertical Dashed Lines
          if (showQuartilesInput.checked && dataset1.length > 0) {
            const s1 = getStats(dataset1);
            const quartiles = [
              { val: s1.q25, label: '25%' },
              { val: s1.median, label: '50%' },
              { val: s1.q75, label: '75%' }
            ];

            ctx.save();
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';

            quartiles.forEach(q => {
              const xPos = x.getPixelForValue(xPoints.findIndex(pt => pt >= q.val));
              if (xPos >= left && xPos <= right) {
                ctx.beginPath();
                ctx.moveTo(xPos, bottom);
                ctx.lineTo(xPos, top + 30);
                ctx.stroke();

                ctx.fillText(q.label, xPos, bottom - 10);
              }
            });
            ctx.restore();
          }

          // Render Custom Chart Header Title inside canvas
          ctx.save();
          ctx.font = 'bold 16px -apple-system, sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(chartTitleInput.value.toUpperCase(), left + 10, top + 25);
          ctx.restore();
        }
      };

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: xPoints.map(p => p.toFixed(1)),
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.1)' },
              ticks: { color: '#888', maxTicksLimit: 12 }
            },
            y: {
              display: false,
              beginAtZero: true
            }
          }
        },
        plugins: [customOverlayPlugin]
      });
    }

    // Zoom Functions
    function applyZoom(factor) {
      const allData = [...dataset1, ...dataset2];
      if (allData.length === 0) return;

      const globalMin = Math.min(...allData);
      const globalMax = Math.max(...allData);

      let currentMin = customMinX !== null ? customMinX : Math.floor(globalMin - 1);
      let currentMax = customMaxX !== null ? customMaxX : Math.ceil(globalMax + 1);

      const center = (currentMin + currentMax) / 2;
      const halfRange = ((currentMax - currentMin) / 2) * factor;

      customMinX = Math.max(0, center - halfRange);
      customMaxX = center + halfRange;

      minXInput.value = customMinX.toFixed(1);
      maxXInput.value = customMaxX.toFixed(1);

      renderChart();
    }

    // Modal Control
    const pasteModal = document.getElementById('pasteModal');
    const modalTitle = document.getElementById('modalTitle');
    const dataInput = document.getElementById('dataInput');

    document.getElementById('pasteDataBtn').onclick = () => {
      targetDataset = 1;
      modalTitle.innerText = "Paste Data (Set 1)";
      pasteModal.classList.add('active');
    };

    document.getElementById('pasteData2Btn').onclick = () => {
      targetDataset = 2;
      modalTitle.innerText = "Paste Data (Set 2)";
      pasteModal.classList.add('active');
    };

    document.getElementById('closeModalBtn').onclick = () => {
      pasteModal.classList.remove('active');
    };

    document.getElementById('loadDataBtn').onclick = () => {
      const times = parseTimes(dataInput.value);
      if (times.length > 0) {
        if (targetDataset === 1) dataset1 = times;
        else dataset2 = times;
        
        customMinX = null;
        customMaxX = null;
        renderChart();
        pasteModal.classList.remove('active');
        dataInput.value = '';
      } else {
        alert("Could not parse valid solve times! Make sure you paste times or csTimer export text.");
      }
    };

    // Zoom Event Listeners
    document.getElementById('zoomInBtn').onclick = () => applyZoom(0.8);
    document.getElementById('zoomOutBtn').onclick = () => applyZoom(1.25);
    document.getElementById('zoomResetBtn').onclick = () => {
      customMinX = null;
      customMaxX = null;
      minXInput.value = '';
      maxXInput.value = '';
      renderChart();
    };

    minXInput.onchange = () => {
      const val = parseFloat(minXInput.value);
      customMinX = !isNaN(val) ? val : null;
      renderChart();
    };

    maxXInput.onchange = () => {
      const val = parseFloat(maxXInput.value);
      customMaxX = !isNaN(val) ? val : null;
      renderChart();
    };

    // Form Control Event Listeners
    chartTitleInput.oninput = renderChart;
    bandwidthInput.oninput = renderChart;
    showStatsInput.onchange = renderChart;
    showQuartilesInput.onchange = renderChart;
    color1Input.oninput = renderChart;
    color2Input.oninput = renderChart;

    // Save Image
    document.getElementById('saveImgBtn').onclick = () => {
      const link = document.createElement('a');
      link.download = 'cubing-distribution-chart.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    };

    // Initial Render
    renderChart();
  </script>
</body>
</html>
